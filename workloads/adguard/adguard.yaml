apiVersion: v1
kind: Pod
metadata:
  name: adguard
  labels:
    app: adguard
    traefik.enable: "true"
    traefik.docker.network: dmz
    traefik.http.routers.adguard-dashboard.rule: Host(`adguard-dashboard.host3d.org`)
    traefik.http.routers.adguard-dashboard.entrypoints: https
    traefik.http.routers.adguard-dashboard.tls: "true"
    traefik.http.routers.adguard-dashboard.tls.certresolver: letsencrypt
    traefik.http.services.adguard-dashboard.loadbalancer.server.port: "80"
    traefik.http.routers.adguard-dashboard.service: adguard-dashboard
    traefik.http.routers.adguard-admin.rule: Host(`adguard-admin.host3d.org`)
    traefik.http.routers.adguard-admin.entrypoints: https
    traefik.http.routers.adguard-admin.tls: "true"
    traefik.http.routers.adguard-admin.tls.certresolver: letsencrypt
    traefik.http.services.adguard-admin.loadbalancer.server.port: "3000"
    traefik.http.routers.adguard-admin.service: adguard-admin
spec:
  restartPolicy: OnFailure
  containers:
    - name: adguard
      image: docker.io/adguard/adguardhome:latest
      ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 3000
          protocol: TCP
        - containerPort: 53
          hostPort: 53
          protocol: TCP
        - containerPort: 53
          hostPort: 53
          protocol: UDP
      resources:
        limits:
          cpu: 500m
          memory: 128Mi
      volumeMounts:
        - name: adguard-conf
          mountPath: /opt/adguardhome/conf
        - name: adguard-work
          mountPath: /opt/adguardhome/work
  volumes:
    - name: adguard-conf
      persistentVolumeClaim:
        claimName: adguard-conf
    - name: adguard-work
      persistentVolumeClaim:
        claimName: adguard-work
