apiVersion: v1
kind: Pod
metadata:
  name: whoami
  labels:
    app: whoami
    traefik.enable: "true"
    traefik.docker.network: systemd-dmz
    traefik.http.services.whoami.loadbalancer.server.port: "80"
    traefik.http.routers.whoami.rule: "Host(`whoami.host3d.org`)"
spec:
  restartPolicy: OnFailure
  containers:
  - name: whoami
    image: docker.io/traefik/whoami:latest
    ports:
    - containerPort: 80
      protocol: TCP
